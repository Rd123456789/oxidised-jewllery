<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Oxidised Jewellery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110f"/>
      <stop offset="1" stop-color="#241d18"/>
    </linearGradient>
    <linearGradient id="patina" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98a53"/>
      <stop offset="1" stop-color="#8a5a2b"/>
    </linearGradient>
    <clipPath id="band">
      <path
        fill-rule="evenodd"
        d="M32 11a21 21 0 1 0 0 42 21 21 0 0 0 0-42zm0 6a15 15 0 1 1 0 30 15 15 0 0 1 0-30z"
      />
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Oxidised patina speckle: the signature of hand-oxidised silver. -->
  <g fill="#b98a53" opacity="0.5">
    <circle cx="14" cy="46" r="1.6"/>
    <circle cx="19" cy="51" r="1.1"/>
    <circle cx="50" cy="16" r="1.4"/>
    <circle cx="45" cy="12" r="0.9"/>
  </g>

  <!-- O monogram drawn as a ring so it stays legible at 16px. -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#patina)" stroke-width="6"/>
  <!-- Glint follows the ring's own curvature, clipped to the band so it reads as light on
       oxidised metal rather than a floating capsule. -->
  <g clip-path="url(#band)">
    <path
      d="M19.5 22.5A17 17 0 0 1 27 16.2"
      fill="none"
      stroke="#fbfaf9"
      stroke-width="2.4"
      stroke-linecap="round"
      opacity="0.9"
    />
  </g>
</svg>
