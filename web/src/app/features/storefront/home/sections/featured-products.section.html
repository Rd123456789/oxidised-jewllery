<section class="ox-container ox-section">
  <app-section-header
    [eyebrow]="eyebrow()"
    [title]="title()"
    linkLabel="View all"
    linkRoute="/shop"
  />

  @if (loading()) {
    <div class="ox-rail">
      @for (placeholder of [1, 2, 3, 4]; track placeholder) {
        <div class="sm:w-48 lg:w-56">
          <div class="ox-card overflow-hidden">
            <div class="ox-skeleton aspect-[4/5] w-full rounded-none"></div>
            <div class="space-y-2 p-4">
              <div class="ox-skeleton h-3 w-2/3"></div>
              <div class="ox-skeleton h-3 w-1/3"></div>
            </div>
          </div>
        </div>
      }
    </div>
  } @else if (products().length === 0) {
    <p class="text-sm text-ink-soft">
      Nothing featured yet — browse the full
      <a routerLink="/shop" class="underline">collection</a>.
    </p>
  } @else {
    <app-scroll-rail>
      @for (product of products(); track product.id) {
        <app-product-card class="block sm:w-48 lg:w-56" [product]="product" />
      }
    </app-scroll-rail>
  }
</section>
