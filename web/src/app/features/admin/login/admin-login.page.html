<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-ink px-4 py-12">
  <div class="pointer-events-none absolute -right-24 -top-24 h-72 w-72 rounded-full bg-brass/20 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-24 -left-24 h-72 w-72 rounded-full bg-brass-deep/25 blur-3xl"></div>

  <div class="relative w-full max-w-md">
    <div class="mb-6 flex items-center justify-center gap-3">
      <span
        class="flex h-10 w-10 items-center justify-center rounded-full bg-brass font-display text-sm font-semibold text-white"
      >
        OX
      </span>
      <span class="font-display text-2xl text-ivory">OX Admin</span>
    </div>

    <div class="ox-card p-6 sm:p-8">
      <p class="ox-eyebrow">Restricted area</p>
      <h1 class="ox-page-title mt-2">Sign in to admin</h1>
      <p class="mt-1 text-sm text-ink-muted">
        Manage the catalogue, orders and storefront content.
      </p>

      @if (error()) {
        <div
          class="mt-5 flex items-start gap-2 rounded-lg border border-rose/30 bg-rose/5 p-3 text-sm text-rose"
          role="alert"
        >
          <app-icon name="alert" [size]="16" />
          <span>{{ error() }}</span>
        </div>
      }

      <form class="mt-5 space-y-4" (submit)="submit($event)">
        <div>
          <label class="ox-label" for="admin-email">Email</label>
          <input
            id="admin-email"
            type="email"
            class="ox-input"
            autocomplete="username"
            placeholder="admin@oxidisedjewellery.test"
            [value]="email()"
            (input)="email.set(textOf($event))"
          />
        </div>

        <div>
          <label class="ox-label" for="admin-password">Password</label>
          <div class="relative">
            <input
              id="admin-password"
              [type]="showPassword() ? 'text' : 'password'"
              class="ox-input pr-16"
              autocomplete="current-password"
              placeholder="••••••••"
              [value]="password()"
              (input)="password.set(textOf($event))"
            />
            <button
              type="button"
              class="absolute inset-y-0 right-0 px-3 text-xs font-semibold text-brass"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              (click)="showPassword.update((visible) => !visible)"
            >
              {{ showPassword() ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <button type="submit" class="ox-btn ox-btn--primary ox-btn--block" [disabled]="loading()">
          @if (loading()) {
            <span class="ox-spinner"></span>
            Signing in…
          } @else {
            Sign in
          }
        </button>
      </form>

      <div class="mt-6 rounded-lg border border-dashed border-sand-deep bg-sand/40 p-3 text-xs text-ink-muted">
        <p class="font-semibold text-ink-soft">Seeded dev credentials</p>
        <p class="mt-1">admin&#64;oxidisedjewellery.test · Admin&#64;12345</p>
      </div>
    </div>

    <p class="mt-6 text-center text-xs text-ivory/60">
      <a class="transition hover:text-brass-soft" routerLink="/">← Back to storefront</a>
    </p>
  </div>
</div>
