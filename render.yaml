# Render blueprint for the free single-origin deploy.
#
# One web service serves the API *and* the built Angular storefront, so the refresh cookie
# can stay `sameSite=lax`, `/sitemap.xml` resolves for crawlers, and no CORS entry is needed
# for the app's own requests.
#
# `install:ci` forces devDependencies because `NODE_ENV=production` is set for the runtime
# and would otherwise stop the Angular CLI from being installed at build time.
#
# Secrets marked `sync: false` are entered in the Render dashboard; the JWT and cookie
# secrets are generated by Render and never leave the service.
#
# Free-plan caveat: the service spins down after ~15 minutes idle, so the first request
# after a quiet period takes 30-60 seconds.

services:
  - type: web
    name: oxidised-jewellery
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm run install:ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: BCRYPT_ROUNDS
        value: "10"

      # MongoDB Atlas (M0 free tier). Atlas Network Access must allow 0.0.0.0/0,
      # because Render's outbound addresses are not fixed.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: oxidised_jewellery

      # Generated once by Render and kept out of the repository.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true

      # Cloudinary is required here, not optional: the free plan has no persistent disk,
      # so locally stored uploads disappear on every restart. Seeded demo images are
      # published to Cloudinary by `npm run seed` for the same reason.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: oxidised-jewellery

      # Only needed for origins other than the service's own (a custom domain, for example).
      # The service always trusts itself.
      - key: CORS_ORIGINS
        value: https://oxidised-jewellery.onrender.com
